<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Noor</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="theme-zakhrafa">
<div id="stage">
  <div id="wall"></div><div id="shade"></div>
  <header id="top">
    <div id="clockBlock">
      <div id="greet"><span id="greetText"></span> <svg class="leaf" viewBox="0 0 24 24"><path d="M4 20c0-8 6-14 16-16-1 10-7 16-15 16m0 0 9-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></div>
      <div id="clockRow"><div id="clock"></div><div id="sep"></div>
        <div id="dateBlock"><div id="line1"><span id="hijri"></span><span id="weather"></span></div>
          <div id="line2"><svg class="mosque" viewBox="0 0 24 24"><path d="M12 3c2.5 2 4.5 3.6 4.5 6.2H7.5C7.5 6.6 9.5 5 12 3ZM6 10h12v10H6zM2.5 8h2v12h-2zM19.5 8h2v12h-2zM10.5 14a1.5 1.5 0 0 1 3 0v6h-3z" fill="currentColor"/></svg><span id="nextLine"></span></div>
          <div id="greg"></div></div></div>
    </div>
    <div id="pills"><span class="pill" id="cityPill"></span><span class="iconBtn" id="gearBtn"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg></span></div>
  </header>

  <div id="banners"><div id="reminder" class="pill big"></div></div>

  <main id="home">
    <div id="titleRow"><div id="bigTitle"></div><div id="prayers"></div></div>
    <nav id="dock"><div id="menu"></div></nav>
  </main>
</div>

<section id="reader" class="panel hidden"><div class="pwall"></div>
  <div class="panelHead"><h2 id="readerTitle"></h2><span class="hint" id="readerHint"></span></div>
  <div id="readerBody"></div>
  <div id="player" class="hidden">
    <span id="pIcon">▶</span>
    <div id="pMid"><div id="pName"></div><div id="pTrack"><div id="pBar"></div></div><div id="pStatus"></div></div>
    <span id="pTime"></span>
  </div>
</section>

<section id="settings" class="panel hidden"><div class="pwall"></div>
  <div class="panelHead"><h2 id="settingsTitle"></h2><span class="hint" id="settingsHint"></span></div>
  <div id="settingsBody"></div>
</section>

<section id="adhan" class="hidden">
  <div class="adhanCard">
    <div class="adhanPill"><svg class="mosque" viewBox="0 0 24 24"><path d="M12 3c2.5 2 4.5 3.6 4.5 6.2H7.5C7.5 6.6 9.5 5 12 3ZM6 10h12v10H6zM2.5 8h2v12h-2zM19.5 8h2v12h-2zM10.5 14a1.5 1.5 0 0 1 3 0v6h-3z" fill="currentColor"/></svg><span id="adhanSub"></span> <b id="adhanName"></b></div>
    <div class="adhanRow"><div class="pill big" id="adhanMaqam"></div></div>
    <div class="adhanHint" id="adhanHint"></div>
  </div>
</section>

<div id="night" class="hidden"><div id="nightClock"></div><div id="nightHint"></div></div>
<div id="iqamahBanner" class="hidden"><div class="iqPill"><svg class="mosque" viewBox="0 0 24 24"><path d="M12 3c2.5 2 4.5 3.6 4.5 6.2H7.5C7.5 6.6 9.5 5 12 3ZM6 10h12v10H6zM2.5 8h2v12h-2zM19.5 8h2v12h-2zM10.5 14a1.5 1.5 0 0 1 3 0v6h-3z" fill="currentColor"/></svg><span id="iqamahText"></span></div></div>
<audio id="iqamahAudio" src="chime.mp3" preload="auto"></audio>
<audio id="adhanAudio" preload="none"></audio>
<audio id="quranAudio" preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
