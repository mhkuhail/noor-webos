name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Syntax-check the helper
        run: node --check helper/noor-helper.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: noor-ipk
          path: dist/*.ipk

      # Publish automatically: a push whose package.json version has no release yet creates
      # release v<version> with the .ipk and that version's CHANGELOG section.
      - name: Detect new version
        id: ver
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          printf '\n---\n⬇️ **Install:** download `com.noor.webos_%s_all.ipk` below → webOS Dev Manager → Install. Guide: [docs/INSTALL.md](https://github.com/%s/blob/%s/docs/INSTALL.md)\n' "$V" "$GITHUB_REPOSITORY" "$GITHUB_SHA" >> release-notes.md
      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: نور لتلفزيونات LG webOS — v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*.ipk
          make_latest: true

      - name: Attach the .ipk to a manually published release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.ipk
