name: build

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - name: Syntax-check the helper
        run: node --check helper/noor-helper.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: noor-ipk
          path: dist/*.ipk

      # Publish automatically: a push whose package.json version has no release yet creates
      # release v<version> with the .ipk and that version's CHANGELOG section.
      - name: Detect new version
        id: ver
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / && f {exit} f' CHANGELOG.md > release-notes.md
          {
            printf '\n---\n## ⬇️ Download\n\n'
            printf '| Your TV | File | Guide |\n|---|---|---|\n'
            printf '| **Android TV / Google TV / STC TV box** | **noor-android.apk** (below) | [docs/ANDROID.md](https://github.com/%s/blob/v%s/docs/ANDROID.md) |\n' "$GITHUB_REPOSITORY" "$V"
            printf '| **LG webOS** | **com.noor.webos_%s_all.ipk** (below) | [docs/INSTALL.md](https://github.com/%s/blob/v%s/docs/INSTALL.md) |\n' "$V" "$GITHUB_REPOSITORY" "$V"
            printf '\nAndroid one-command install from a Mac:\n```bash\ncurl -fsSL https://raw.githubusercontent.com/%s/v%s/scripts/install-android.sh | bash -s <TV-IP>\n```\n' "$GITHUB_REPOSITORY" "$V"
          } >> release-notes.md
      - name: Publish release
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: نور — LG webOS و Android TV — v${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: dist/*.ipk
          make_latest: true

      - name: Attach the .ipk to a manually published release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.ipk

  # Android TV / Google TV build: the same web app inside a native shell (android/).
  android:
    runs-on: ubuntu-latest
    needs: package        # on a version bump, the release above exists before the APK is attached to it
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Signing key
        # Add repo secrets NOOR_KEYSTORE_B64 (base64 of a .jks) and NOOR_KEYSTORE_PASSWORD so every build is signed
        # with the same key and installs as an update. Without them each build gets a throwaway debug key.
        env:
          NOOR_KEYSTORE_B64: ${{ secrets.NOOR_KEYSTORE_B64 }}
        run: |
          if [ -n "$NOOR_KEYSTORE_B64" ]; then
            echo "$NOOR_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/noor.jks"
            echo "NOOR_KEYSTORE_FILE=$RUNNER_TEMP/noor.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No NOOR_KEYSTORE_B64 secret: the APK is signed with a debug key (uninstall before installing a newer build)."
          fi
      - name: Build APK
        env:
          NOOR_KEYSTORE_PASSWORD: ${{ secrets.NOOR_KEYSTORE_PASSWORD }}
        run: bash scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: noor-apk
          path: dist/*.apk
      - name: Attach the APK to this version's release
        # a new version was just released by the package job, or a push to the default branch rebuilt the current one
        if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') && (needs.package.outputs.new == 'true' || github.ref_name == github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then gh release upload "v$V" dist/*.apk --clobber --repo "$GITHUB_REPOSITORY"; fi
      - name: Attach the APK to a manually published release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          files: dist/*.apk
